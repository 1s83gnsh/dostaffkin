name: Day 6 build temp

on:
  push:
    branches:
      - day6-backend-deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: day6-docs-build
          path: docs
      - uses: actions/upload-artifact@v4
        with:
          name: day6-full-project
          path: |
            angular.json
            package.json
            package-lock.json
            public
            src
            tsconfig.json
            tsconfig.app.json
            tsconfig.spec.json
            docs
